name: Release

run-name: Release ${{ github.ref_name }} by ${{ github.actor }}

# v0.1.0 のようなタグを push すると .app を組み立てて GitHub Release に添付する
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: swift test

      - name: Assemble app
        env:
          # CI に証明書は無いので ad-hoc 署名。Gatekeeper の警告が出るため、初回は右クリックから開く
          CODESIGN_IDENTITY: "-"
          APP_BUILD: ${{ github.run_number }}
        # タグ v0.1.0 → 0.1.0
        run: APP_VERSION="${GITHUB_REF_NAME#v}" scripts/make_app.sh

      - name: Zip app
        # ditto は署名と拡張属性を保ったまま zip にできる
        run: ditto -c -k --keepParent build/Panely.app "build/Panely-${{ github.ref_name }}.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "build/Panely-${{ github.ref_name }}.zip" \
            --title "Panely ${{ github.ref_name }}" \
            --generate-notes

      - name: Create summary
        if: always()
        run: |
          {
            echo "## Release サマリー"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| タグ | ${{ github.ref_name }} |"
            echo "| 実行者 | ${{ github.actor }} |"
            echo "| 実行時刻 | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
            echo "| 成果物 | Panely-${{ github.ref_name }}.zip |"
            echo "| 署名 | ad-hoc（公証なし） |"
          } >> "$GITHUB_STEP_SUMMARY"
